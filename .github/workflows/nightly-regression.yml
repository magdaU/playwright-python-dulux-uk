name: Nightly Regression (Python)

# Scheduled regression run against production, independent of any push/PR, so
# catalogue/UI drift on the live Dulux site (see docs/TEST_STRATEGY.md S10) is
# caught even on days with no code changes. Chromium only — cross-browser
# coverage is the separate, manually-triggered cross-browser-regression.yml.
on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      pytest_markers:
        description: "Pytest marker expression to run"
        required: false
        default: "regression"

permissions:
  contents: write   # required by peaceiris/actions-gh-pages to push to gh-pages branch

jobs:
  pytest-nightly-regression:
    name: Pytest regression suite
    runs-on: ubuntu-latest
    env:
      PYTEST_MARKERS: ${{ github.event.inputs.pytest_markers || 'regression' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore previous nightly Allure history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run pytest suite
        run: pytest -m "${PYTEST_MARKERS}" --alluredir=allure-results

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline --save-dev

      - name: Write Allure executor info
        if: always()
        run: |
          mkdir -p allure-results
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Nightly #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Add Allure categories
        if: always()
        run: |
          mkdir -p allure-results
          cp allure/categories.json allure-results/categories.json

      - name: Write Allure environment info
        if: always()
        run: |
          mkdir -p allure-results
          cat > allure-results/environment.properties <<EOF
          Target=Production (https://www.dulux.co.uk)
          Browser=Chromium
          Runner=${{ runner.os }} (ubuntu-latest)
          Python=$(python --version | cut -d" " -f2)
          Playwright=$(pip show playwright | sed -n "s/^Version: //p")
          Markers=${PYTEST_MARKERS}
          Branch=${{ github.ref_name }}
          Commit=${GITHUB_SHA::7}
          EOF

      - name: Carry over Allure history (Trend widget)
        if: always()
        run: |
          if [ -d gh-pages/nightly/history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/nightly/history/. allure-results/history/
          fi

      - name: Generate Allure HTML report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-nightly
          path: allure-results

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-nightly
          path: allure-report

      - name: Deploy Allure report to GitHub Pages (nightly/)
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          destination_dir: nightly
          keep_files: true   # keep the smoke report published at the gh-pages root
          commit_message: "ci: publish nightly Allure report [skip ci]"
